version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vinci-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-vinci}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vinci-network

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinci-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-vinci}
      PASSWORD_ROUNDS: ${PASSWORD_ROUNDS:-10}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      STORAGE_TYPE: ${STORAGE_TYPE:-disk}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/firebase-key.json}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./firebase-key.json:/app/firebase-key.json:ro
    networks:
      - vinci-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  vinci-network:
    driver: bridge

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vinci-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vinci
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vinci-network-dev

  # NestJS Application in development mode
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vinci-app-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vinci
      PASSWORD_ROUNDS: 10
      JWT_SECRET: dev-secret-key
      JWT_EXPIRES_IN: 7d
      STORAGE_TYPE: disk
      APP_URL: http://localhost:3000
    ports:
      - '3000:3000'
      - '9229:9229'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - vinci-network-dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local

networks:
  vinci-network-dev:
    driver: bridge
